# API gateway: the ONLY backend address the mobile/web app needs.
#   /api/<service>/<path>   ->   <service>/<path>      (the /api/<service> prefix is stripped)
#
#   /api/user/...           user-service          :3001
#   /api/cgm/...            cgm-service           :3000   (/api/cgm/stream is a WebSocket)
#   /api/medication/...     medication-service    :3002
#   /api/recommender/...    recommender-service   :3004
#
# emergency-service has no HTTP API (Kafka only) and the sensor WebSocket (:4000) stays internal.
# This file is mounted as /etc/nginx/conf.d/default.conf, so it is already inside nginx's http block.

# CORS: browsers (Expo web) need it, native apps ignore it. Only local/LAN origins are allowed.
map $http_origin $cors_origin {
    default "";
    "~^https?://(localhost|127\.0\.0\.1|10\.0\.2\.2|192\.168\.\d+\.\d+|10\.\d+\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+)(:\d+)?$" $http_origin;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    # Docker's embedded DNS. Used together with `set $upstream` below, so service names are
    # re-resolved at request time: a restarted container never leaves nginx with a stale IP,
    # and nginx starts even when a backend is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- CORS ----
    proxy_hide_header Access-Control-Allow-Origin;   # user-service already sends its own: avoid duplicates
    proxy_hide_header Access-Control-Allow-Credentials;
    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key" always;
    add_header Access-Control-Max-Age       600 always;
    add_header Vary                         Origin always;
    if ($request_method = OPTIONS) { return 204; }

    # ---- proxy defaults (inherited by every location below) ----
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;

    error_page 502 503 504 = @backend_unavailable;
    location @backend_unavailable {
        default_type application/json;
        return 503 '{"error":"Service temporarily unavailable"}';
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/user/ {
        set $upstream http://user-service:3001;
        rewrite ^/api/user/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    # WebSocket: live glucose readings pushed to the app  ->  ws://<host>:8080/api/cgm/stream
    location = /api/cgm/stream {
        set $upstream http://cgm-service:3000;
        rewrite ^/api/cgm/stream$ /stream break;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        # a proxy_set_header in a location replaces the ones inherited from the server block: repeat them
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # a quiet connection is normal (readings arrive every few minutes)
        proxy_send_timeout 3600s;
        proxy_pass $upstream;
    }

    location /api/cgm/ {
        set $upstream http://cgm-service:3000;
        rewrite ^/api/cgm/(.*)$ /$1 break;
        proxy_read_timeout 120s;   # AGP report generation
        proxy_pass $upstream;
    }

    location /api/medication/ {
        set $upstream http://medication-service:3002;
        rewrite ^/api/medication/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/recommender/ {
        set $upstream http://recommender-service:3004;
        rewrite ^/api/recommender/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location / {
        default_type application/json;
        return 404 '{"error":"Unknown route. Use /api/<service>/..."}';
    }
}