services:
  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    volumes:
      - zookeeper-data:/bitnami/zookeeper

  kafka:
    image: bitnami/kafka:3.7
    container_name: kafkaBroker
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka-data:/bitnami/kafka
    depends_on:
      - zookeeper

  redis:
    image: redis:7-alpine
    container_name: redis
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka-init:
    image: bitnami/kafka:3.7
    container_name: kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    restart: "no"

  mongodb:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  user-service:
    build:
      context: ./services/user-service
      target: dev
    container_name: user-service
    ports:
      - "3001:3001"
    env_file:
      - ./services/user-service/.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/userdb
      - KAFKA_BROKER=kafka:9092
    volumes:
      - ./libs/kafka-utils/wait-for-kafka.sh:/wait-for-kafka.sh:ro
      - ./services/user-service:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    command: ["/wait-for-kafka.sh", "kafka", "npm", "run", "dev"]
    depends_on:
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  cgm-service:
    build:
      context: ./services/cgm-service
      target: dev
    container_name: cgm-service
    ports:
      - "3000:3000"
      # 4000 (sensor WebSocket) stays internal: the simulated sensors run inside this container.
      # Publish it only when real sensors must connect from outside.
    env_file:
      - ./services/cgm-service/.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/cgmdb
      - KAFKA_BROKER=kafka:9092
      - CGM_TIMEZONE=Africa/Cairo
      - CGM_HISTORY_RETENTION_DAYS=90
      - SIM_INTERVAL_SECONDS=300
      - SIMULATE_SENSORS=true
    volumes:
      - ./libs/kafka-utils/wait-for-kafka.sh:/wait-for-kafka.sh:ro
      - ./services/cgm-service:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    command: ["/wait-for-kafka.sh", "kafka", "npm", "run", "dev"]
    depends_on:
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  recommender-service:
    build:
      context: ./services/recommender-service
    container_name: recommender-service
    ports:
      - "3004:3004"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/recommenderdb
      - KAFKA_BROKER=kafka:9092
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2-3b-local
      - REDIS_URL=redis://redis:6379
      - DEFAULT_TIMEZONE=Africa/Cairo
    volumes:
      - ./libs/kafka-utils/wait-for-kafka.sh:/wait-for-kafka.sh:ro
      - ./services/recommender-service:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    command: ["/wait-for-kafka.sh", "kafka", "npm", "run", "dev"]
    depends_on:
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy

  emergency-service:
    build:
      context: ./services/emergency-service
      target: dev
    container_name: emergency-service
    ports:
      - "3003:3003"
    env_file:
      - ./services/emergency-service/.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/emergencydb
      - KAFKA_BROKER=kafka:9092
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase-key
    volumes:
      - ./libs/kafka-utils/wait-for-kafka.sh:/wait-for-kafka.sh:ro
      - ./secrets/firebase-key.json:/run/secrets/firebase-key:ro
      - ./services/emergency-service:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    command: ["/wait-for-kafka.sh", "kafka", "npm", "run", "dev"]
    depends_on:
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
  medication-service:
    build:
      context: ./services/medication-service
      target: dev
    container_name: medication-service
    secrets:
      - firebase-key
    ports:
      - "3002:3002"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/medicationdb
      - KAFKA_BROKER=kafka:9092
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase-key
      - REDIS_URL=redis://redis:6379
      - DEFAULT_TIMEZONE=Africa/Cairo
    env_file:
      - ./services/medication-service/.env
    volumes:
      - ./libs/kafka-utils/wait-for-kafka.sh:/wait-for-kafka.sh:ro
      - ./secrets/firebase-key.json:/run/secrets/firebase-key:ro
      - ./services/medication-service:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    command: ["/wait-for-kafka.sh", "kafka", "npm", "run", "dev"]
    depends_on:
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # API gateway: the only backend address the app talks to (http://<host>:8080/api/<service>/...)
  # No depends_on on purpose: nginx resolves service names per request, so it never waits for
  # (or breaks because of) a slow service such as the recommender waiting for Ollama.
  # ---------------------------------------------------------------------------
  gateway:
    image: nginx:1.27-alpine
    container_name: gateway
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Expo dev server (Metro). The phone / emulator connects to it on port 8081.
  # REACT_NATIVE_PACKAGER_HOSTNAME must be your computer's LAN IP, otherwise the QR code
  # contains the container's private Docker IP and the phone cannot reach it.
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: frontend
    ports:
      - "8081:8081"
    environment:
      - REACT_NATIVE_PACKAGER_HOSTNAME=${HOST_IP:-localhost}
      - EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL:-http://localhost:8080/api}
      - EXPO_NO_TELEMETRY=1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true # lets the QR code render in `docker-compose logs frontend`
    tty: true
    command: npx expo start ${EXPO_START_FLAGS:---lan}
    depends_on:
      - gateway

volumes:
  mongo-data:
  ollama-data:
  zookeeper-data:
  kafka-data:
  redis-data:

secrets:
  firebase-key:
    file: ./secrets/firebase-key.json
